<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Senasoft</title>
    <style>
        :root {
            --sena-green: #39A900;
            --sena-blue: #00324D;
            --ios-bg: #F2F2F7;
            --card-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--ios-bg);
            color: #1C1C1E;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .sena-logo {
            width: 65px;
            height: auto;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            background-color: rgba(57, 169, 0, 0.12);
            color: var(--sena-green);
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        h1 {
            color: var(--sena-blue);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p {
            color: #8E8E93;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--sena-green);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(57, 169, 0, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.97);
            background-color: #319300;
        }

        .btn-secondary {
            background-color: rgba(0, 50, 77, 0.06);
            color: var(--sena-blue);
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background-color: rgba(0, 50, 77, 0.12);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRr1yYzWpX_LL1zL1ncCyw03P-qnQpqQXyTcLT3-aJq7w&s=10" alt="Logo SENA" class="sena-logo">
        <br>
        <span class="badge">SENASOFT 2026</span>
        <h1>¡Bienvenidos!</h1>
        <p>Sistema oficial de registro y consulta de competidores para el evento.</p>
        
        <div class="menu">
            <a href="/senasoft/registro/" class="btn btn-primary">Inscribir Competidor</a>
            <a href="/senasoft/competidores/" class="btn btn-secondary">Ver Competidores</a>
        </div>
    </div>
</body>
</html>
